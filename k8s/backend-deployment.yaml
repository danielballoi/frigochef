apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigochef-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frigochef-backend
  template:
    metadata:
      labels:
        app: frigochef-backend
    spec:
      containers:
        - name: backend
          image: frigochef-backend:dev
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
