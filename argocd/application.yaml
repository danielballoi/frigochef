apiVersion: argoproj.io/v1alpha1   # il "tipo di linguaggio": Application è un oggetto che Argo CD ha aggiunto a Kubernetes
kind: Application                   # cosa stai creando
metadata:
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frigochef
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/danielballoi/frigochef.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
